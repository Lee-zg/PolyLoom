packages:
  - apps/*
  - examples/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.5
  '@vitejs/plugin-vue': ^6.0.8
  '@vue/server-renderer': ^3.5.40
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: 7.0.2
  vite: ^8.2.0
  vue: ^3.5.40
  vue-tsc: ^3.2.4

# 新版本先经过一天社区验证，降低供应链投毒与误发版本带来的风险。
minimumReleaseAge: 1440
