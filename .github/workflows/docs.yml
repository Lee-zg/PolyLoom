name: 发布文档

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建包和文档
        run: |
          pnpm build:packages
          pnpm docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传文档
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
