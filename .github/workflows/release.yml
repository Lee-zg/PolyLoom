name: 发布 npm 包

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initial_release:
        description: 确认以一次性 Token 首发 0.1.0
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: 发布前完整验收
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.initial_release) ||
      (github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装三浏览器
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: 执行发布验收
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm validate:exports
          pnpm validate:packages
          pnpm test:pack
          pnpm docs:build
          pnpm test:e2e
        env:
          DOCS_BASE: /${{ github.event.repository.name }}
          PLAYWRIGHT_BROWSER: all
          SITE_URL: https://${{ github.repository_owner }}.github.io

  initial-release:
    name: 首次发布 0.1.0
    if: github.event_name == 'workflow_dispatch' && inputs.initial_release
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查首发凭证
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::npm Environment 缺少 NPM_TOKEN_BOOTSTRAP，已停止首发。"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_BOOTSTRAP }}

      - name: 发布六个公开包
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_BOOTSTRAP }}

      - name: 建立首版标签
        shell: bash
        run: |
          tags=(
            '@polyloom/core@0.1.0'
            '@polyloom/theme@0.1.0'
            '@polyloom/plugins@0.1.0'
            '@polyloom/vue@0.1.0'
            '@polyloom/react@0.1.0'
            'polyloom@0.1.0'
            'v0.1.0'
          )
          for tag in "${tags[@]}"; do
            git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1 || git tag "$tag" "$GITHUB_SHA"
          done
          git push origin --tags

      - name: 建立包级与统一 GitHub Release
        shell: bash
        run: |
          releases=(
            '@polyloom/core@0.1.0|@polyloom/core 0.1.0|packages/core/CHANGELOG.md'
            '@polyloom/theme@0.1.0|@polyloom/theme 0.1.0|packages/theme/CHANGELOG.md'
            '@polyloom/plugins@0.1.0|@polyloom/plugins 0.1.0|packages/plugins/CHANGELOG.md'
            '@polyloom/vue@0.1.0|@polyloom/vue 0.1.0|packages/vue/CHANGELOG.md'
            '@polyloom/react@0.1.0|@polyloom/react 0.1.0|packages/react/CHANGELOG.md'
            'polyloom@0.1.0|polyloom 0.1.0|packages/polyloom/CHANGELOG.md'
            'v0.1.0|PolyLoom 0.1.0|RELEASE_NOTES.md'
          )
          for release in "${releases[@]}"; do
            IFS='|' read -r tag title notes <<< "$release"
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --verify-tag --title "$title" --notes-file "$notes"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 验证 registry 版本与 provenance
        shell: bash
        run: |
          packages=(
            '@polyloom/core'
            '@polyloom/theme'
            '@polyloom/plugins'
            '@polyloom/vue'
            '@polyloom/react'
            'polyloom'
          )
          for package in "${packages[@]}"; do
            test "$(npm view "$package" version)" = '0.1.0'
            attestation_url="$(npm view "$package" dist.attestations.url)"
            if [ -z "$attestation_url" ]; then
              echo "::error::$package 缺少 npm provenance attestation。"
              exit 1
            fi
          done

  trusted-release:
    name: Changesets OIDC 发布
    if: github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 创建版本 PR 或通过 OIDC 发布
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 发布新版本
          commit: 发布新版本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 首发完成后，维护者需配置六个 Trusted Publisher、删除 bootstrap Secret，
      # 再将仓库变量 NPM_TRUSTED_PUBLISHING_READY 设置为 true。
