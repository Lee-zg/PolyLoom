name: 发布 npm 包

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initial_release:
        description: 确认以一次性 Token 首发 0.1.0
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: 发布前完整验收
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.initial_release) ||
      (github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装三浏览器
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: 执行发布验收
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm validate:exports
          pnpm validate:packages
          pnpm test:pack
          pnpm docs:build
          pnpm test:e2e
        env:
          # E2E 静态服务器挂载在根路径；Pages 的仓库前缀由 docs.yml 单独构建和验证。
          DOCS_BASE: /
          PLAYWRIGHT_BROWSER: all
          SITE_URL: https://${{ github.repository_owner }}.github.io

  initial-release:
    name: 首次发布 0.1.0
    if: github.event_name == 'workflow_dispatch' && inputs.initial_release
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验发布运行时
        shell: bash
        run: |
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          version_at_least() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n 1)" = "$1" ]
          }
          version_at_least '22.14.0' "$node_version" || {
            echo "::error::Node.js $node_version 低于发布要求 22.14.0。"
            exit 1
          }
          version_at_least '11.5.1' "$npm_version" || {
            echo "::error::npm $npm_version 低于 Trusted Publishing 要求 11.5.1。"
            exit 1
          }
          echo "发布运行时：Node.js $node_version，npm $npm_version"

      - name: 检查首发凭证
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::npm Environment 缺少 NPM_TOKEN_BOOTSTRAP，已停止首发。"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_BOOTSTRAP }}

      - name: 检查首发身份与包名
        shell: bash
        run: |
          publisher="$(npm whoami)"
          packages=(
            '@polyloom/core'
            '@polyloom/theme'
            '@polyloom/plugins'
            '@polyloom/vue'
            '@polyloom/react'
            'polyloom'
          )
          error_log="$(mktemp)"
          trap 'rm -f "$error_log"' EXIT

          for package in "${packages[@]}"; do
            if version="$(npm view "$package" version 2>"$error_log")"; then
              if [ "$version" != '0.1.0' ]; then
                echo "::error::$package 已存在非预期版本 $version，已停止首发。"
                exit 1
              fi

              repository="$(npm view "$package" repository.url)"
              case "$repository" in
                'git+https://github.com/Lee-zg/PolyLoom.git'|'https://github.com/Lee-zg/PolyLoom.git')
                  ;;
                *)
                  echo "::error::$package 0.1.0 的仓库来源不属于 Lee-zg/PolyLoom。"
                  exit 1
                  ;;
              esac

              maintainers="$(npm view "$package" maintainers --json)"
              node -e '
                const value = JSON.parse(process.argv[1]);
                const maintainers = Array.isArray(value) ? value : [value];
                if (!maintainers.some(({ name }) => name === process.argv[2])) process.exit(1);
              ' "$maintainers" "$publisher" || {
                echo "::error::$package 0.1.0 不属于当前 npm 身份 $publisher。"
                exit 1
              }
              echo "$package 0.1.0 已由当前身份发布，将按幂等流程复核。"
              continue
            fi

            if grep -Eq 'E404|404 Not Found' "$error_log"; then
              echo "$package 尚未发布，可以首发。"
              continue
            fi

            cat "$error_log"
            echo "::error::无法确认 $package 的 registry 状态，已停止首发。"
            exit 1
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_BOOTSTRAP }}

      - name: 发布六个公开包
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_BOOTSTRAP }}

      - name: 验证 registry、README、安装与 provenance
        shell: bash
        run: |
          packages=(
            '@polyloom/core'
            '@polyloom/theme'
            '@polyloom/plugins'
            '@polyloom/vue'
            '@polyloom/react'
            'polyloom'
          )
          for package in "${packages[@]}"; do
            test "$(npm view "$package" version)" = '0.1.0'
            attestation_url="$(npm view "$package" dist.attestations.url)"
            if [ -z "$attestation_url" ]; then
              echo "::error::$package 缺少 npm provenance attestation。"
              exit 1
            fi
            if [ -z "$(npm view "$package" readme)" ]; then
              echo "::error::$package 缺少 registry README。"
              exit 1
            fi
          done
          mkdir registry-smoke
          npm install --prefix registry-smoke --ignore-scripts \
            @polyloom/core@0.1.0 \
            @polyloom/theme@0.1.0 \
            @polyloom/plugins@0.1.0 \
            @polyloom/vue@0.1.0 \
            @polyloom/react@0.1.0 \
            polyloom@0.1.0 \
            vue@3 react@19 react-dom@19

      - name: 建立首版标签
        shell: bash
        run: |
          tags=(
            '@polyloom/core@0.1.0'
            '@polyloom/theme@0.1.0'
            '@polyloom/plugins@0.1.0'
            '@polyloom/vue@0.1.0'
            '@polyloom/react@0.1.0'
            'polyloom@0.1.0'
            'v0.1.0'
          )
          for tag in "${tags[@]}"; do
            git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1 || git tag "$tag" "$GITHUB_SHA"
          done
          git push origin --tags

      - name: 建立包级与统一 GitHub Release
        shell: bash
        run: |
          releases=(
            '@polyloom/core@0.1.0|@polyloom/core 0.1.0|packages/core/CHANGELOG.md'
            '@polyloom/theme@0.1.0|@polyloom/theme 0.1.0|packages/theme/CHANGELOG.md'
            '@polyloom/plugins@0.1.0|@polyloom/plugins 0.1.0|packages/plugins/CHANGELOG.md'
            '@polyloom/vue@0.1.0|@polyloom/vue 0.1.0|packages/vue/CHANGELOG.md'
            '@polyloom/react@0.1.0|@polyloom/react 0.1.0|packages/react/CHANGELOG.md'
            'polyloom@0.1.0|polyloom 0.1.0|packages/polyloom/CHANGELOG.md'
            'v0.1.0|PolyLoom 0.1.0|RELEASE_NOTES.md'
          )
          for release in "${releases[@]}"; do
            IFS='|' read -r tag title notes <<< "$release"
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --verify-tag --title "$title" --notes-file "$notes"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trusted-release:
    name: Changesets OIDC 发布
    if: github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验发布运行时
        shell: bash
        run: |
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          version_at_least() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n 1)" = "$1" ]
          }
          version_at_least '22.14.0' "$node_version" || {
            echo "::error::Node.js $node_version 低于发布要求 22.14.0。"
            exit 1
          }
          version_at_least '11.5.1' "$npm_version" || {
            echo "::error::npm $npm_version 低于 Trusted Publishing 要求 11.5.1。"
            exit 1
          }
          echo "发布运行时：Node.js $node_version，npm $npm_version"

      - name: 创建版本 PR 或通过 OIDC 发布
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 发布新版本
          commit: 发布新版本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 首发完成后，维护者需配置六个 Trusted Publisher、删除 bootstrap Secret，
      # 再将仓库变量 NPM_TRUSTED_PUBLISHING_READY 设置为 true。
